# Application profile untuk CI/CD environment
# Digunakan untuk bypass Flyway validation pada saat initial setup

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration untuk CI
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=false
# Repair mode untuk fix checksum issues (use only in CI setup, NOT in production)
spring.flyway.clean-disabled=false

jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJSONAppThatShouldBeAtLeast256BitsLong!}
jwt.expiration=86400000

